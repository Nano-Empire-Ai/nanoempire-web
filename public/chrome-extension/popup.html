<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano Empire AI Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      min-height: 480px;
      background-color: #07090D;
      color: #F4F1EA;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(140, 146, 164, 0.2);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .brand {
      font-weight: bold;
      color: #FF7B00;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: rgba(163, 255, 0, 0.1);
      color: #A3FF00;
      border: 1px solid rgba(163, 255, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(140, 146, 164, 0.2);
      border-radius: 6px;
      padding: 10px;
    }
    .label { color: #8C92A4; font-size: 10px; margin-bottom: 4px; text-transform: uppercase; }
    .val { font-weight: bold; font-size: 13px; color: #FFF; }
    .lime { color: #A3FF00; }
    .orange { color: #FF7B00; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(140, 146, 164, 0.2);
      border-radius: 6px;
      color: #F4F1EA;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255, 123, 0, 0.15);
      border-color: #FF7B00;
      color: #FFF;
    }
    .btn-primary {
      background: #FF7B00;
      color: #000;
      font-weight: bold;
      text-align: center;
      margin-top: 14px;
    }
    .btn-primary:hover {
      background: #FF8E24;
      color: #000;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      color: #8C92A4;
      font-size: 10px;
      border-top: 1px solid rgba(140, 146, 164, 0.15);
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>⚡ NANO EMPIRE</span>
    </div>
    <span class="badge">x402 ACTIVE</span>
  </div>

  <div class="stats">
    <div class="card">
      <div class="label">ORNN H100 TAPE</div>
      <div class="val orange">$2.78 / hr</div>
    </div>
    <div class="card">
      <div class="label">SETTLEMENT RAILS</div>
      <div class="val lime">Base + SOL</div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 14px;">
    <div class="label">CONNECTED GATEWAY</div>
    <div class="val" style="font-size: 11px; word-break: break-all; color: #A3FF00;">
      nano-empire-mcp.run.app
    </div>
  </div>

  <a class="btn" href="https://nanoempireai.com/tape" target="_blank">
    📊 Open Live GPU Tape (OCPI) &rarr;
  </a>
  <a class="btn" href="https://nanoempireai.com/llms.txt" target="_blank">
    🤖 Read Machine Manifest (llms.txt) &rarr;
  </a>
  <a class="btn" href="https://nanoempireai.com#playground" target="_blank">
    ⚡ Test x402 Console &rarr;
  </a>

  <a class="btn btn-primary" href="https://nanoempireai.com" target="_blank">
    Launch Full Hub &rarr;
  </a>

  <div class="footer">
    NANO EMPIRE AI INC. &bull; M2M DARK POOL v1.0
  </div>
</body>
</html>
