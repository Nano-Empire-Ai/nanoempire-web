name: SkillProof Self-Audit Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SkillProof Gate Engine
        run: |
          python packages/skillproof-action/scanner.py --scan-path packages/skillproof-action --min-score 75
